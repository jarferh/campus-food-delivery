<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Food Delivery</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    --deep-green: #164B35;
    --green: #1F9D5C;
    --bright-green: #35B76B;
    --mint: #EAF7EF;
    --paper: #FFFFFF;
    --ink: #16241C;
    --muted: #5C7268;
    --line: #D7EBDF;
    --amber: #F0A93C;

    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--mint);
    color: var(--ink);
  }

  h1, h2, h3, .display {
    font-family: 'Poppins', 'Inter', sans-serif;
  }

  .app-shell {
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    padding-bottom: 84px;
    background: var(--mint);
    box-shadow: 0 0 40px rgba(22,75,53,0.08);
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 20px 14px;
    background: var(--deep-green);
    color: white;
    border-radius: 0 0 22px 22px;
  }
  .topbar-mark {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: var(--bright-green);
    color: var(--deep-green);
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .topbar-title {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 17px;
    line-height: 1.2;
  }
  .topbar-subtitle {
    font-size: 12.5px;
    color: #BFE3CF;
    margin-top: 2px;
  }

  .screen { padding: 18px 18px 12px; }

  /* HOME */
  .hero {
    background: linear-gradient(155deg, var(--green), var(--deep-green));
    color: white;
    border-radius: 20px;
    padding: 22px 20px;
    margin: -6px 0 20px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: "";
    position: absolute;
    right: -30px;
    bottom: -40px;
    width: 140px;
    height: 140px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .hero-eyebrow { font-size: 13px; color: #C9EBD6; margin-bottom: 6px; }
  .hero-heading {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.35;
    max-width: 250px;
  }
  .hero-cta {
    margin-top: 16px;
    background: white;
    color: var(--deep-green);
    border: none;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 16px;
    border-radius: 11px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-family: inherit;
  }

  .section-heading {
    font-size: 15px;
    font-weight: 600;
    margin: 4px 0 12px;
    color: var(--deep-green);
  }

  .quick-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }
  .quick-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .quick-emoji { font-size: 22px; }
  .quick-name { font-size: 13px; font-weight: 600; }
  .quick-price { font-size: 12px; color: var(--muted); }

  .info-strip {
    display: flex;
    gap: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px 14px;
    align-items: flex-start;
  }
  .info-strip svg { color: var(--green); flex-shrink: 0; margin-top: 2px; }
  .info-strip-title { font-size: 13.5px; font-weight: 600; }
  .info-strip-text { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }

  /* MENU */
  .food-card {
    display: flex;
    gap: 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 13px;
    margin-bottom: 12px;
  }
  .food-thumb {
    width: 64px;
    height: 64px;
    border-radius: 13px;
    background: var(--mint);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    flex-shrink: 0;
  }
  .food-info { flex: 1; min-width: 0; }
  .food-tag {
    font-size: 11px;
    color: var(--green);
    font-weight: 600;
    margin-bottom: 2px;
  }
  .food-name { font-weight: 600; font-size: 15px; }
  .food-desc {
    font-size: 12px;
    color: var(--muted);
    margin: 3px 0 8px;
    line-height: 1.4;
  }
  .food-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .food-price { font-weight: 700; color: var(--deep-green); font-size: 14px; }

  .add-btn {
    background: var(--green);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 7px 12px;
    font-size: 12.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .add-btn:hover { background: var(--deep-green); }

  .stepper {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--mint);
    border-radius: 10px;
    padding: 4px 8px;
  }
  .stepper-btn {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    border: none;
    background: white;
    color: var(--deep-green);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    line-height: 1;
    padding: 0;
  }
  .stepper-count { font-weight: 600; font-size: 13px; min-width: 10px; text-align: center; }

  /* CART */
  .cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .cart-item .food-thumb { width: 48px; height: 48px; font-size: 22px; }
  .cart-item-name { font-weight: 600; font-size: 14px; }
  .cart-item-price { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .cart-item-total { font-weight: 700; font-size: 13.5px; color: var(--deep-green); min-width: 62px; text-align: right; }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
  }
  .empty-emoji { font-size: 40px; margin-bottom: 10px; }
  .empty-title { font-weight: 600; color: var(--ink); margin-bottom: 4px; }

  .summary-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-top: 18px;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 13.5px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .summary-row.total {
    color: var(--ink);
    font-weight: 700;
    font-size: 15.5px;
    border-top: 1px dashed var(--line);
    padding-top: 10px;
    margin-top: 4px;
  }
  .place-order-btn {
    width: 100%;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 13px;
    padding: 13px;
    font-weight: 600;
    font-size: 15px;
    margin-top: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .place-order-btn:disabled {
    background: #A9CDB9;
    cursor: not-allowed;
  }

  /* ORDERS */
  .order-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .order-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .order-id { font-weight: 700; font-size: 14px; }
  .order-date { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .order-status {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--mint);
    color: var(--green);
    white-space: nowrap;
  }
  .order-status.preparing { background: #FDF0DC; color: #B9760B; }
  .order-items { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; line-height: 1.5; }
  .order-total {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 13.5px;
    color: var(--deep-green);
    border-top: 1px dashed var(--line);
    padding-top: 8px;
  }

  /* PROFILE */
  .profile-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    margin-bottom: 18px;
  }
  .avatar {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    background: var(--deep-green);
    color: white;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
  }
  .profile-name { font-weight: 600; font-size: 17px; }
  .profile-matric {
    display: inline-block;
    margin-top: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--green);
    background: var(--mint);
    padding: 4px 12px;
    border-radius: 20px;
  }

  .detail-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .detail-row svg { color: var(--green); flex-shrink: 0; }
  .detail-label { font-size: 11.5px; color: var(--muted); }
  .detail-value { font-size: 13.5px; font-weight: 600; margin-top: 1px; }

  .footer-credit {
    text-align: center;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 22px;
    line-height: 1.6;
  }

  /* NAV */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 460px;
    background: white;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-around;
    padding: 8px 6px calc(env(safe-area-inset-bottom, 0px) + 8px);
    z-index: 20;
  }
  .nav-btn {
    background: none;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 600;
    padding: 4px 8px;
    cursor: pointer;
    position: relative;
    font-family: inherit;
  }
  .nav-btn.active { color: var(--green); }
  .nav-badge {
    position: absolute;
    top: -2px;
    right: 2px;
    background: var(--amber);
    color: white;
    font-size: 9px;
    font-weight: 700;
    min-width: 15px;
    height: 15px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* CONFIRMATION MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(22,36,28,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay.hidden { display: none; }
  .modal-card {
    background: white;
    border-radius: 22px;
    padding: 30px 24px;
    width: 85%;
    max-width: 360px;
    text-align: center;
  }
  .modal-check {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--mint);
    color: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }
  .modal-title { font-weight: 600; font-size: 18px; margin-bottom: 6px; }
  .modal-text { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 18px; }
  .modal-id {
    font-size: 13px;
    font-weight: 700;
    color: var(--deep-green);
    background: var(--mint);
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 18px;
  }
  .modal-btn {
    width: 100%;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<div class="app-shell">
  <div id="screen-root"></div>

  <div class="bottom-nav">
    <button class="nav-btn" data-tab="home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </button>
    <button class="nav-btn" data-tab="menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
      Menu
    </button>
    <button class="nav-btn" data-tab="cart" style="position:relative;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 2-1.58l1.65-7.42H5.12"/></svg>
      <span id="cart-badge" class="nav-badge" style="display:none;"></span>
      Cart
    </button>
    <button class="nav-btn" data-tab="orders">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2h16v20l-4-2-4 2-4-2-4 2Z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
      Orders
    </button>
    <button class="nav-btn" data-tab="profile">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </button>
  </div>

  <div class="modal-overlay hidden" id="confirm-modal">
    <div class="modal-card">
      <div class="modal-check">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="modal-title">Order placed!</div>
      <p class="modal-text" id="modal-text"></p>
      <div class="modal-id" id="modal-order-id"></div>
      <button class="modal-btn" id="modal-view-orders">View my orders</button>
    </div>
  </div>
</div>

<script>
  // ---------- DATA ----------
  const FOOD_ITEMS = [
    { id: "jollof", name: "Jollof Rice", price: 2500, emoji: "🍚", tag: "Campus favourite",
      desc: "Smoky party-style jollof, served hot with a side of coleslaw." },
    { id: "friedrice", name: "Fried Rice & Chicken", price: 3500, emoji: "🍗", tag: "Big portion",
      desc: "Vegetable fried rice with a grilled chicken quarter." },
    { id: "yamegg", name: "Yam & Egg", price: 2000, emoji: "🍳", tag: "Breakfast pick",
      desc: "Boiled yam with a well-spiced fried egg sauce." },
    { id: "meatpie", name: "Meat Pie", price: 1000, emoji: "🥟", tag: "Quick snack",
      desc: "Flaky pastry filled with seasoned minced meat and potato." },
    { id: "drink", name: "Soft Drink", price: 700, emoji: "🥤", tag: "Chilled",
      desc: "Your choice of chilled soft drink, 50cl bottle." },
  ];

  const STUDENT = {
    name: "Abdullahi Ishaq Nataala",
    matric: "CSEU/25/10640",
    department: "Computer Science / Cyber Security",
    level: "100 Level",
    hostel: "Amina Hall, Block C",
    email: "nataalskee66@gmail.com",
    phone: "08085760455",
  };

  let orders = [
    { id: "ORD-1042", date: "Sep 8, 2026 · 12:41 PM", status: "Delivered",
      items: [{ name: "Jollof Rice", qty: 1 }, { name: "Soft Drink", qty: 1 }], total: 3200 },
    { id: "ORD-1038", date: "Sep 5, 2026 · 7:15 PM", status: "Delivered",
      items: [{ name: "Fried Rice & Chicken", qty: 1 }, { name: "Meat Pie", qty: 2 }], total: 5500 },
    { id: "ORD-1029", date: "Sep 1, 2026 · 1:02 PM", status: "Delivered",
      items: [{ name: "Yam & Egg", qty: 1 }], total: 2000 },
  ];

  // ---------- STATE ----------
  let tab = "home";
  let cart = {}; // { id: qty }
  const deliverTo = STUDENT.hostel;

  // ---------- HELPERS ----------
  const naira = (n) => "₦" + n.toLocaleString("en-NG");

  function cartEntries() {
    return Object.entries(cart)
      .map(([id, qty]) => ({ item: FOOD_ITEMS.find((f) => f.id === id), qty }))
      .filter((e) => e.item);
  }
  function cartCount() {
    return cartEntries().reduce((sum, e) => sum + e.qty, 0);
  }
  function cartTotal() {
    return cartEntries().reduce((sum, e) => sum + e.qty * e.item.price, 0);
  }

  function addToCart(id) {
    cart[id] = (cart[id] || 0) + 1;
    render();
  }
  function removeFromCart(id) {
    if (!cart[id]) return;
    cart[id] -= 1;
    if (cart[id] <= 0) delete cart[id];
    render();
  }

  function placeOrder() {
    const entries = cartEntries();
    if (entries.length === 0) return;
    const deliveryFee = 200;
    const newOrder = {
      id: "ORD-" + (1000 + orders.length + 43),
      date: "Just now",
      status: "Preparing",
      items: entries.map((e) => ({ name: e.item.name, qty: e.qty })),
      total: cartTotal() + deliveryFee,
    };
    orders.unshift(newOrder);
    cart = {};
    showConfirmModal(newOrder);
    render();
  }

  function showConfirmModal(order) {
    document.getElementById("modal-text").textContent =
      "Your food is being prepared and will be delivered to " + deliverTo + " shortly.";
    document.getElementById("modal-order-id").textContent = order.id + " · " + naira(order.total);
    document.getElementById("confirm-modal").classList.remove("hidden");
  }
  function hideConfirmModal() {
    document.getElementById("confirm-modal").classList.add("hidden");
  }

  function setTab(t) {
    tab = t;
    render();
  }

  // ---------- TEMPLATES ----------
  function topBar(title, subtitle) {
    return `
      <div class="topbar">
        <div class="topbar-mark">CF</div>
        <div>
          <div class="topbar-title">${title}</div>
          ${subtitle ? `<div class="topbar-subtitle">${subtitle}</div>` : ""}
        </div>
      </div>`;
  }

  function foodCardTemplate(item) {
    const qty = cart[item.id] || 0;
    const control = qty > 0
      ? `<div class="stepper">
           <button class="stepper-btn" data-action="remove" data-id="${item.id}">−</button>
           <span class="stepper-count">${qty}</span>
           <button class="stepper-btn" data-action="add" data-id="${item.id}">+</button>
         </div>`
      : `<button class="add-btn" data-action="add" data-id="${item.id}">+ Add to cart</button>`;

    return `
      <div class="food-card">
        <div class="food-thumb">${item.emoji}</div>
        <div class="food-info">
          <div class="food-tag">${item.tag}</div>
          <div class="food-name">${item.name}</div>
          <p class="food-desc">${item.desc}</p>
          <div class="food-row">
            <span class="food-price">${naira(item.price)}</span>
            ${control}
          </div>
        </div>
      </div>`;
  }

  function renderHome() {
    const quickItems = FOOD_ITEMS.slice(0, 4).map((item) => `
      <div class="quick-card">
        <div class="quick-emoji">${item.emoji}</div>
        <div>
          <div class="quick-name">${item.name}</div>
          <div class="quick-price">${naira(item.price)}</div>
        </div>
      </div>`).join("");

    return `
      ${topBar("Campus Food Delivery", "Hi, " + STUDENT.name.split(" ")[0] + " 👋")}
      <div class="screen">
        <div class="hero">
          <div class="hero-eyebrow">Hungry between lectures?</div>
          <div class="hero-heading">Order campus meals, delivered straight to your hostel.</div>
          <button class="hero-cta" id="browse-menu-btn">
            Browse the menu
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

        <div class="section-heading">Popular right now</div>
        <div class="quick-grid">${quickItems}</div>

        <div class="section-heading">Delivery info</div>
        <div class="info-strip">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <div>
            <div class="info-strip-title">Delivering to ${deliverTo}</div>
            <div class="info-strip-text">Orders placed before 9 PM arrive within 30–40 minutes. Pay on delivery or with your student wallet.</div>
          </div>
        </div>

        <div class="footer-credit">
          Campus Food Delivery — School Project<br>
          ${STUDENT.name} · ${STUDENT.matric}
        </div>
      </div>`;
  }

  function renderMenu() {
    return `
      ${topBar("Food Menu", "Freshly prepared on campus")}
      <div class="screen">
        ${FOOD_ITEMS.map(foodCardTemplate).join("")}
      </div>`;
  }

  function renderCart() {
    const entries = cartEntries();
    const count = cartCount();
    const total = cartTotal();
    const deliveryFee = count > 0 ? 200 : 0;

    let body;
    if (entries.length === 0) {
      body = `
        <div class="empty-state">
          <div class="empty-emoji">🛒</div>
          <div class="empty-title">Your cart is empty</div>
          <p>Add something tasty from the food menu.</p>
        </div>`;
    } else {
      const items = entries.map(({ item, qty }) => `
        <div class="cart-item">
          <div class="food-thumb">${item.emoji}</div>
          <div style="flex:1;">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">${naira(item.price)} each</div>
          </div>
          <div class="stepper">
            <button class="stepper-btn" data-action="remove" data-id="${item.id}">−</button>
            <span class="stepper-count">${qty}</span>
            <button class="stepper-btn" data-action="add" data-id="${item.id}">+</button>
          </div>
          <div class="cart-item-total">${naira(qty * item.price)}</div>
        </div>`).join("");

      body = `
        ${items}
        <div class="summary-card">
          <div class="summary-row"><span>Subtotal</span><span>${naira(total)}</span></div>
          <div class="summary-row"><span>Delivery fee</span><span>${naira(deliveryFee)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${naira(total + deliveryFee)}</span></div>
          <button class="place-order-btn" id="place-order-btn">Place order</button>
        </div>`;
    }

    return `
      ${topBar("Your Cart", count + " item" + (count === 1 ? "" : "s"))}
      <div class="screen">${body}</div>`;
  }

  function renderOrders() {
    const cards = orders.map((order) => {
      const itemsHtml = order.items.map((it) => `<div>${it.qty} × ${it.name}</div>`).join("");
      const statusClass = order.status === "Preparing" ? "preparing" : "";
      return `
        <div class="order-card">
          <div class="order-top">
            <div>
              <div class="order-id">${order.id}</div>
              <div class="order-date">${order.date}</div>
            </div>
            <span class="order-status ${statusClass}">${order.status}</span>
          </div>
          <div class="order-items">${itemsHtml}</div>
          <div class="order-total"><span>Total</span><span>${naira(order.total)}</span></div>
        </div>`;
    }).join("");

    return `
      ${topBar("My Orders", "Track your past deliveries")}
      <div class="screen">${cards}</div>`;
  }

  function renderProfile() {
    const initials = STUDENT.name.split(" ").map((w) => w[0]).slice(0, 2).join("");
    return `
      ${topBar("Profile", "Your student account")}
      <div class="screen">
        <div class="profile-card">
          <div class="avatar">${initials}</div>
          <div class="profile-name">${STUDENT.name}</div>
          <div class="profile-matric">${STUDENT.matric}</div>
        </div>

        <div class="detail-row">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>
          <div><div class="detail-label">Department</div><div class="detail-value">${STUDENT.department}</div></div>
        </div>
        <div class="detail-row">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
          <div><div class="detail-label">Level</div><div class="detail-value">${STUDENT.level}</div></div>
        </div>
        <div class="detail-row">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <div><div class="detail-label">Hostel / Delivery address</div><div class="detail-value">${STUDENT.hostel}</div></div>
        </div>
        <div class="detail-row">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
          <div><div class="detail-label">Email</div><div class="detail-value">${STUDENT.email}</div></div>
        </div>
        <div class="detail-row">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>
          <div><div class="detail-label">Phone</div><div class="detail-value">${STUDENT.phone}</div></div>
        </div>

        <div class="footer-credit">
          Campus Food Delivery — School Project<br>
          Developed by ${STUDENT.name} · ${STUDENT.matric}
        </div>
      </div>`;
  }

  // ---------- RENDER ----------
  function render() {
    const root = document.getElementById("screen-root");
    if (tab === "home") root.innerHTML = renderHome();
    else if (tab === "menu") root.innerHTML = renderMenu();
    else if (tab === "cart") root.innerHTML = renderCart();
    else if (tab === "orders") root.innerHTML = renderOrders();
    else if (tab === "profile") root.innerHTML = renderProfile();

    // nav active states + badge
    document.querySelectorAll(".nav-btn").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.tab === tab);
    });
    const badge = document.getElementById("cart-badge");
    const count = cartCount();
    if (count > 0) {
      badge.style.display = "flex";
      badge.textContent = count;
    } else {
      badge.style.display = "none";
    }

    attachScreenListeners();
  }

  function attachScreenListeners() {
    const root = document.getElementById("screen-root");

    root.querySelectorAll("[data-action='add']").forEach((btn) => {
      btn.addEventListener("click", () => addToCart(btn.dataset.id));
    });
    root.querySelectorAll("[data-action='remove']").forEach((btn) => {
      btn.addEventListener("click", () => removeFromCart(btn.dataset.id));
    });

    const browseBtn = document.getElementById("browse-menu-btn");
    if (browseBtn) browseBtn.addEventListener("click", () => setTab("menu"));

    const placeBtn = document.getElementById("place-order-btn");
    if (placeBtn) placeBtn.addEventListener("click", placeOrder);
  }

  // ---------- STATIC LISTENERS ----------
  document.querySelectorAll(".nav-btn[data-tab]").forEach((btn) => {
    btn.addEventListener("click", () => setTab(btn.dataset.tab));
  });
  document.getElementById("modal-view-orders").addEventListener("click", () => {
    hideConfirmModal();
    setTab("orders");
  });

  // ---------- INIT ----------
  render();
</script>

</body>
</html>
